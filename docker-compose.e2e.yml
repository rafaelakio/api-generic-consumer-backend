version: '3.8'

services:
  localstack:
    image: localstack/localstack:3.0
    container_name: api-consumer-localstack-e2e
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,secretsmanager,apigateway
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - "./localstack-init:/etc/localstack/init/ready.d"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - api-consumer-e2e-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-consumer-backend-e2e
    ports:
      - "8080:8080"
    environment:
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DYNAMODB_ENDPOINT=http://localstack:4566
      - AWS_DYNAMODB_TABLE_NAME=audit-logs
      - AWS_SECRET_NAME_API_CREDENTIALS=api-consumer/api-credentials
      - SPRING_PROFILES_ACTIVE=local
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://frontend
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      - ADMIN_JWT_SECRET=e2e-test-secret-key-change-in-production-256-bits-long
      - ADMIN_JWT_EXPIRATION_MS=86400000
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - api-consumer-e2e-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ../api-generic-consumer-frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=http://localhost:4566/restapis/API_ID/local/_user_request_
        - NEXT_PUBLIC_AZURE_CLIENT_ID=test-client-id
        - NEXT_PUBLIC_AZURE_TENANT_ID=test-tenant-id
        - NEXT_PUBLIC_AZURE_REDIRECT_URI=http://localhost:3000
    container_name: api-consumer-frontend-e2e
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - api-consumer-e2e-network
    environment:
      - NODE_ENV=production

networks:
  api-consumer-e2e-network:
    name: api-consumer-e2e-network
    driver: bridge

