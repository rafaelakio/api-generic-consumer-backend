apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-consumer-backend
  namespace: api-consumer
  annotations:
    # IRSA: bind this SA to the IAM role that has Secrets Manager read permission.
    # The role ARN is provisioned by infra/terraform/eks_irsa.tf.
    eks.amazonaws.com/role-arn: "${IRSA_ROLE_ARN}"
