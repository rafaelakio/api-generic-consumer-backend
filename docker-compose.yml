version: '3.8'

services:
  localstack:
    image: localstack/localstack:3.0
    container_name: api-consumer-localstack
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - SERVICES=dynamodb,secretsmanager,apigateway
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    volumes:
      - "./localstack-init:/etc/localstack/init/ready.d"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "localstack-data:/tmp/localstack"
    networks:
      - api-consumer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-consumer-backend
    ports:
      - "8080:8080"
    environment:
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DYNAMODB_ENDPOINT=http://localstack:4566
      - AWS_DYNAMODB_TABLE_NAME=audit-logs
      - AWS_SECRET_NAME_API_CREDENTIALS=api-consumer/api-credentials
      - SPRING_PROFILES_ACTIVE=local
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      - ADMIN_JWT_SECRET=local-dev-secret-key-change-in-production-256-bits
      - ADMIN_JWT_EXPIRATION_MS=86400000
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - api-consumer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  api-consumer-network:
    name: api-consumer-network
    driver: bridge

volumes:
  localstack-data:
    name: api-consumer-localstack-data

