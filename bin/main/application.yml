server:
  port: 8080

spring:
  application:
    name: api-generic-consumer-backend
  security:
    oauth2:
      resourceserver:
        jwt:
          # Azure AD JWKS — set AZURE_TENANT_ID in env or override the full URI
          jwk-set-uri: ${AZURE_AD_JWKS_URI:https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/discovery/v2.0/keys}

aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb:
    endpoint: ${AWS_DYNAMODB_ENDPOINT:}
    table-name: ${AWS_DYNAMODB_TABLE_NAME:audit-logs}

app:
  secrets:
    api-credentials-name: ${AWS_SECRET_NAME_API_CREDENTIALS:api-consumer/api-credentials}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
    jwt-secret: ${ADMIN_JWT_SECRET:change-me-in-production-use-256-bit-key}
    jwt-expiration-ms: ${ADMIN_JWT_EXPIRATION_MS:86400000}
  servicenow:
    enabled: ${SERVICENOW_ENABLED:false}
    base-url: ${SERVICENOW_BASE_URL:}
    username: ${SERVICENOW_USERNAME:}
    password: ${SERVICENOW_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.apiconsumer: INFO
